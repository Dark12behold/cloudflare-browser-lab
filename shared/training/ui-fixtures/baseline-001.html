<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI Lab Fixture</title><style>*{box-sizing:border-box}body{font:16px system-ui;margin:0;padding:24px;background:#f4f4f5;color:#18181b}.shell{max-width:720px;margin:auto}.toolbar,.tabs{display:flex;gap:8px;flex-wrap:wrap}.card{background:white;border:1px solid #d4d4d8;border-radius:12px;padding:20px;margin-top:16px}.dialog{border:0;border-radius:12px;padding:0;max-width:420px;width:calc(100% - 32px)}.dialog article{padding:20px}.dialog::backdrop{background:rgb(0 0 0/.45)}button{min-height:44px;padding:8px 14px}button:focus-visible{outline:3px solid currentColor;outline-offset:2px}.status{min-height:24px;margin-top:12px}@media(max-width:375px){body{padding:12px}.toolbar button{flex:1 1 100%}}</style></head><body><main class="shell"><h1>UI Lab Fixture</h1><div class="toolbar"><button id="open">Open dialog</button><button id="toggle" aria-pressed="false">Toggle setting</button></div><section class="card" aria-labelledby="card-title"><h2 id="card-title">Environment</h2><div class="tabs" role="tablist" aria-label="Environment views"><button role="tab" aria-selected="true">Overview</button><button role="tab" aria-selected="false">Activity</button></div><p class="status" id="status" aria-live="polite">Ready</p></section></main><dialog class="dialog" id="dialog"><article><h2>Confirm change</h2><p>This is an isolated training fixture.</p><button id="confirm">Confirm</button> <button id="cancel">Cancel</button></article></dialog><script>const d=document.querySelector("#dialog"),s=document.querySelector("#status"),t=document.querySelector("#toggle");open.onclick=()=>d.showModal();cancel.onclick=()=>d.close();confirm.onclick=()=>{s.textContent="Change confirmed";d.close()};t.onclick=()=>{const v=t.getAttribute("aria-pressed")!=="true";t.setAttribute("aria-pressed",v);s.textContent=v?"Setting enabled":"Setting disabled"};document.querySelectorAll('[role=tab]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[role=tab]').forEach(y=>y.setAttribute("aria-selected",String(y===x)));s.textContent=x.textContent+" selected"})</script></body></html>
