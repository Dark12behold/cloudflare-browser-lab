<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adaptive UI Browser Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#101114;color:#eee;overflow:hidden}
#app{height:100vh;display:grid;grid-template-rows:auto 1fr auto}
#tabs{display:flex;gap:6px;padding:8px;background:#191b20;border-bottom:1px solid #343741;align-items:center}
.tab{padding:8px 12px;border:1px solid #3c404b;border-radius:8px;background:#242730;color:inherit;cursor:pointer}.tab[aria-selected=true]{background:#eee;color:#111}.tab.locked::after{content:" 🔒"}
#stage{position:relative;overflow:auto;background:linear-gradient(90deg,#17191e 1px,transparent 1px),linear-gradient(#17191e 1px,transparent 1px);background-size:24px 24px}
.panel{position:absolute;left:40px;top:36px;width:min(560px,calc(100% - 80px));min-height:260px;background:#20232a;border:1px solid #444956;border-radius:14px;box-shadow:0 18px 50px #0008}
.panel.locked{outline:2px solid #8d93a3}.title{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #393d47;cursor:move}.title strong{flex:1}
button{background:#303541;color:#fff;border:1px solid #4c5260;border-radius:7px;padding:7px 10px}button:focus-visible{outline:2px solid white;outline-offset:2px}
.content{padding:18px}.object{padding:18px;border:1px solid #4b5260;border-radius:10px;background:#282c35}.object.active{outline:2px solid #b9c1d2}
.menu{position:fixed;z-index:20;min-width:190px;padding:6px;background:#252933;border:1px solid #555c6a;border-radius:9px;box-shadow:0 12px 35px #000a;opacity:0;transform:scale(.97);pointer-events:none;transition:opacity 120ms,transform 120ms}
.menu.open{opacity:1;transform:scale(1);pointer-events:auto}.menu button{display:block;width:100%;text-align:left;border:0;background:transparent}.menu button:hover{background:#3a404d}
#toast{position:fixed;right:16px;bottom:42px;padding:10px 14px;background:#eee;color:#111;border-radius:9px;opacity:0;transform:translateY(8px);transition:.16s}#toast.show{opacity:1;transform:none}
#trace{padding:6px 10px;background:#191b20;border-top:1px solid #343741;color:#aeb5c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
dialog{background:#242832;color:#fff;border:1px solid #555;border-radius:12px;padding:20px}dialog::backdrop{background:#0008}
@media(max-width:500px){.panel{left:12px!important;top:20px!important;width:calc(100% - 24px)}#tabs{overflow:auto}.tab{white-space:nowrap}}
</style></head><body><div id="app">
<nav id="tabs" aria-label="Site tabs"><button class="tab" aria-selected="true">Workspace</button><button class="tab">Sources</button><button class="tab">Activity</button><button id="add">+</button></nav>
<main id="stage">
<section class="panel" id="panel"><header class="title" id="drag"><strong>Working object</strong><button id="actions">Actions</button><button id="lock" aria-pressed="false">Lock</button></header>
<div class="content"><article class="object active" id="object" tabindex="0"><h2>Adaptive object</h2><p>Right-click or open Actions. Controls are bound to this object, not its coordinates.</p><button id="work">Run visible work</button></article></div></section>
</main><div id="trace" aria-live="polite">Ready</div></div>
<div class="menu" id="menu" role="menu"><button role="menuitem" data-action="source">Attach source</button><button role="menuitem" data-action="inspect">Inspect object</button><button role="menuitem" data-action="notify">Notify</button></div>
<div id="toast" role="status"></div>
<dialog id="dialog"><h3>Object inspection</h3><p id="inspectText"></p><button id="closeDialog">Close</button></dialog>
<script>
const q=s=>document.querySelector(s),panel=q("#panel"),menu=q("#menu"),trace=q("#trace"),toast=q("#toast"),dialog=q("#dialog");
const events=[];function log(type,data={}){const e={t:performance.now().toFixed(1),type,...data};events.push(e);trace.textContent=JSON.stringify(e);window.__uiEvidence={events,panel:panel.getBoundingClientRect().toJSON(),menu:menu.getBoundingClientRect().toJSON(),locked:panel.classList.contains("locked")}}
function placeMenu(x,y){menu.classList.add("open");menu.style.left="0px";menu.style.top="0px";const r=menu.getBoundingClientRect(),g=8;let px=x+g,py=y+g,h="right",v="down";if(px+r.width>innerWidth){px=x-r.width-g;h="left"}if(py+r.height>innerHeight){py=y-r.height-g;v="up"}px=Math.max(g,Math.min(px,innerWidth-r.width-g));py=Math.max(g,Math.min(py,innerHeight-r.height-g));menu.style.left=px+"px";menu.style.top=py+"px";requestAnimationFrame(()=>log("menu.interactive",{x:px,y:py,h,v}))}
function closeMenu(){menu.classList.remove("open");log("menu.close")}
q("#actions").onclick=e=>{log("menu.trigger",{source:"button"});placeMenu(e.clientX,e.clientY)}
q("#object").oncontextmenu=e=>{e.preventDefault();log("menu.trigger",{source:"pointer",x:e.clientX,y:e.clientY});placeMenu(e.clientX,e.clientY)}
menu.onclick=e=>{const a=e.target.dataset.action;if(!a)return;if(a==="source")showToast("Source action attached");if(a==="inspect"){q("#inspectText").textContent="Object id: adaptive-object-1. Current position is resolved at runtime.";dialog.showModal()}if(a==="notify")showToast("Notification emitted");log("action.execute",{action:a});closeMenu()}
function showToast(t){toast.textContent=t;toast.classList.add("show");log("notification.show",{text:t});setTimeout(()=>{toast.classList.remove("show");log("notification.hide")},1200)}
q("#lock").onclick=()=>{const locked=panel.classList.toggle("locked");q("#lock").setAttribute("aria-pressed",locked);log("placement.lock",{locked})}
let drag=null;q("#drag").onpointerdown=e=>{if(e.target.tagName==="BUTTON"||panel.classList.contains("locked"))return;const r=panel.getBoundingClientRect();drag={dx:e.clientX-r.left,dy:e.clientY-r.top};q("#drag").setPointerCapture(e.pointerId);log("drag.start")}
q("#drag").onpointermove=e=>{if(!drag)return;panel.style.left=Math.max(0,e.clientX-drag.dx)+"px";panel.style.top=Math.max(0,e.clientY-drag.dy)+"px"}
q("#drag").onpointerup=e=>{if(!drag)return;drag=null;log("drag.end",{left:panel.style.left,top:panel.style.top})}
q("#work").onclick=()=>{log("work.received");q("#work").disabled=true;q("#work").textContent="Working…";setTimeout(()=>{log("work.result_ready");q("#work").textContent="Verified ✓";q("#work").disabled=false;log("work.verified")},500)}
q("#closeDialog").onclick=()=>{dialog.close();log("dialog.close")}
q("#add").onclick=()=>{const b=document.createElement("button");b.className="tab";b.textContent="New "+document.querySelectorAll(".tab").length;q("#tabs").insertBefore(b,q("#add"));log("tab.create",{label:b.textContent})}
q("#tabs").onclick=e=>{if(!e.target.classList.contains("tab"))return;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===e.target));log("tab.select",{label:e.target.textContent})}
document.addEventListener("pointerdown",e=>{if(!menu.contains(e.target)&&e.target!==q("#actions"))menu.classList.remove("open")});log("surface.ready",{width:innerWidth,height:innerHeight});
</script></body></html>
